name: Deploy UAT

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sla-pengajuan-uat-deploy
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend
      - run: npm run check --prefix backend
      - run: npm run check --prefix frontend
      - run: npm run prod

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: uat
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AAPANEL_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.AAPANEL_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${SSH_PRIVATE_KEY:?Add AAPANEL_SSH_PRIVATE_KEY to the uat environment secrets}"
          : "${SSH_KNOWN_HOSTS:?Add verified AAPANEL_KNOWN_HOSTS to the uat environment secrets}"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Deploy on aaPanel
        env:
          AAPANEL_HOST: ${{ vars.AAPANEL_HOST }}
          AAPANEL_PORT: ${{ vars.AAPANEL_PORT }}
          AAPANEL_USER: ${{ vars.AAPANEL_USER }}
        run: |
          set -euo pipefail
          : "${AAPANEL_HOST:?Add AAPANEL_HOST to the uat environment variables}"
          : "${AAPANEL_PORT:?Add AAPANEL_PORT to the uat environment variables}"
          : "${AAPANEL_USER:?Add AAPANEL_USER to the uat environment variables}"
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -p "$AAPANEL_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$AAPANEL_USER@$AAPANEL_HOST" \
            "bash -lc 'cd /www/wwwroot/sla-pengajuan && BACKEND_PM2_NAME=sla-backend FRONTEND_PM2_NAME=sla-frontend FRONTEND_PORT=4173 BACKEND_HEALTH_URL=http://127.0.0.1:3100/api/v1/health/database FRONTEND_HEALTH_URL=http://127.0.0.1:4173/ npm run deploy:production'"
